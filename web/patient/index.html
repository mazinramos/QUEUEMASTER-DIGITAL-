<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b2545">
  <meta name="referrer" content="no-referrer">
  <title>بوابة المريض</title>
  <link rel="stylesheet" href="../shared/fonts.css">
  <link rel="stylesheet" href="../shared/tokens.css">
  <link rel="stylesheet" href="../shared/components.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="pt-shell">
    <header class="pt-header">
      <div class="pt-brand">
        <span class="pt-brand__logo" id="brand-logo"></span>
        <span class="pt-brand__name"><span id="brand-name"></span><span class="pt-brand__sub" id="brand-sub" data-i18n="p.title"></span></span>
      </div>
      <div class="qm-lang" role="group" aria-label="Language / اللغة">
        <button type="button" data-lang="ar" lang="ar">العربية</button>
        <button type="button" data-lang="en" lang="en">EN</button>
      </div>
    </header>
    <div id="conn-banner" class="pt-conn" role="status" aria-live="polite"></div>
    <main class="pt-main" id="app" aria-live="polite"><div style="text-align:center;padding:3rem"><span class="qm-spinner"></span></div></main>
    <footer class="pt-footer" data-i18n="p.privacy"></footer>
  </div>
  <div id="print-sheet" aria-hidden="true"></div>
  <noscript><p style="padding:1rem">JavaScript is required / يلزم تفعيل جافاسكريبت.</p></noscript>

  <script src="../shared/vendor/qrcode.js"></script>
  <script src="../shared/qr.js"></script>
  <script src="../shared/icons.js"></script>
  <script src="../shared/i18n.js"></script>
  <script src="../shared/api.js"></script>
  <script src="../shared/ui.js"></script>
  <script src="../shared/socket-client.js"></script>
  <script src="../shared/vendor/socket.io.min.js"></script>
  <script src="strings.js"></script>
  <script src="logic.js"></script>
  <script src="ticket-image.js"></script>
  <script src="app.js"></script>
</body>
</html>
